<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SOOP 파트너스 멘토링 관리</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#d9dde3;--blue:#1a5fd0;--hb:#cfe0f8;--hy:#fff2cc;--red:#d92d20;--hov:#f1f6ff;--dk:#16181d;--dkt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--ink:#eef0f3;--mute:#9aa1ad;--line:#333844;--blue:#7fadff;--hb:#22344f;--hy:#4a4126;--red:#ff7b72;--hov:#222a38;--dk:#eef0f3;--dkt:#16181d}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--ink:#eef0f3;--mute:#9aa1ad;--line:#333844;--blue:#7fadff;--hb:#22344f;--hy:#4a4126;--red:#ff7b72;--hov:#222a38;--dk:#eef0f3;--dkt:#16181d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px}
button,select,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.wrap{max-width:1360px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:20px;margin:0}
nav{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px}
nav button{padding:9px 18px;border-radius:9px;font-weight:700;color:var(--mute)}
nav button.on{background:var(--dk);color:var(--dkt)}
.theme{margin-left:auto;padding:8px 12px;border-radius:10px;background:var(--card);font-weight:600}
.tools,.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.btn{padding:8px 14px;border-radius:10px;background:var(--card);font-weight:700;border:1px solid var(--line)}
.btn.pri{background:var(--dk);color:var(--dkt);border-color:transparent}.btn.dan{color:var(--red)}.btn:disabled{opacity:.5}
select,input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:100%}
#q{flex:1;min-width:200px}
.seg{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px}
.seg button{padding:7px 14px;border-radius:9px;font-weight:700;color:var(--mute)}.seg button.on{background:var(--dk);color:var(--dkt)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.cols2 .sec{margin:0;min-width:0}@media (max-width:980px){.cols2{grid-template-columns:1fr}}
.sec{margin:0 0 22px}.sec h2{font-size:16px;margin:0 0 8px}.sec h2 span{color:var(--mute);font-weight:500;font-size:13px}
.box{background:var(--card);border-radius:14px;overflow:auto;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}
th,td{border:1px solid var(--line);padding:8px 12px;text-align:center}
th{position:sticky;top:0;z-index:1}.p th{background:var(--hb)}.m th{background:var(--hy)}
tbody tr.go{cursor:pointer}tbody tr.go:hover td{background:var(--hov)}
.red td{color:var(--red)}
body:not(.adm) .adm-only{display:none!important}
.lock{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.lock.on{display:flex}
.lk{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:360px;box-shadow:0 8px 30px #0003}.lk h2{margin:0 0 6px;font-size:18px}.lk p{margin:0 0 14px;color:var(--mute);font-size:13px}
.lk input[type=password]{width:100%;margin-bottom:10px}.lk .ck{margin:0 0 12px;font-weight:500;font-size:13px}.lk .err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{filter:brightness(.94)}
.lnk{color:var(--blue);font-weight:600}a.lnk{text-decoration:underline}.mut{color:var(--mute)}
.ed{width:44px;padding:2px}.ed button{color:var(--mute);padding:6px 8px}
.gap{height:14px}.empty{padding:34px;color:var(--mute);text-align:center}
.note{margin-top:20px;color:var(--mute);font-size:12px;text-align:center}
.ov{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}.ov.on{display:flex}
.md{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:88vh;overflow:auto}
.md h3{margin:0 0 14px}.fl{display:block;margin-bottom:12px;font-weight:600;font-size:13px}
.fl input,.fl select{display:block;width:100%;margin-top:5px;background:var(--bg)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.pv{margin:0 0 10px;padding-left:18px;line-height:1.7}.pv li span{color:var(--mute)}
.ck{display:flex;gap:8px;align-items:center;margin:10px 0 0;font-weight:600}.ck input{padding:0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dk);color:var(--dkt);padding:10px 16px;border-radius:10px;display:none;z-index:10;max-width:90vw}
</style></head><body><div class="wrap">
<header>
<h1>SOOP 파트너스 멘토링 관리</h1>
<nav><button id="n1">멘토 리스트</button><button id="n2">멘티 리스트</button></nav>
<button class="theme" id="theme">☀ 라이트</button>
</header>
<div class="tools"><button class="btn pri adm-only" data-a="imp">📥 엑셀 불러오기</button><button class="btn adm-only" data-a="addp">+ 멘토 추가</button><button class="btn pri adm-only" data-a="pub">📤 배포용 파일 만들기</button><button class="btn adm-only" data-a="pw">🔒 접속 비밀번호</button><button class="btn dan adm-only" data-a="rst">배포본으로 되돌리기</button><span class="mut" id="st">불러오는 중…</span></div>
<div id="flt"><div class="tools"><input id="q" placeholder="아이디·닉네임 검색 (쉼표로 여러 명)"><select id="cat"></select></div><div class="tools"><div class="seg" id="seg"></div><select id="sk" title="정렬 기준"></select><button class="btn" id="sd"></button></div></div>
<main id="main"><div class="empty">불러오는 중…</div></main>
<p class="note" id="nt"></p>
</div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div id="toast"></div>
<div class="lock" id="lock"><div class="lk"><h2>🔒 SOOP 파트너스 멘토링 관리</h2><p>접속 비밀번호를 입력해 주세요.</p><input type="password" id="lkp" autocomplete="current-password" placeholder="비밀번호"><label class="ck"><input type="checkbox" id="lkr">이 브라우저에서 비밀번호 기억</label><div class="err" id="lke"></div><button class="btn pri" id="lkb" style="width:100%">열기</button></div></div>

function fixM(o){o.ms=(o.ms||[]).map(function(m){m.start=normDate(m.start);m.end=normDate(m.end);return m});return o}

async function save(d){
  var id=d.id,body=clone(d);delete body.id;
  if(!DB){if(id){DATA=DATA.map(function(x){return x.id==id?d:x})}else{d.id='l'+Date.now()+Math.random().toString(36).slice(2,6);DATA.push(d)}persist();render();return}
  var ref=id?DB.doc('mentors/'+id):DB.collection('mentors').doc();
  await ref.set(body)}

function filtered(){
  var qs=LV.q.split(',').map(function(s){return s.trim().toLowerCase()}).filter(Boolean);
  return DATA.filter(function(x){return(LV.cat=='전체'||x.cat==LV.cat)&&(!qs.length||qs.some(function(q){return((x.uid||'')+' '+(x.nick||'')).toLowerCase().indexOf(q)>-1}))})}
function render(){
  var h=location.hash.slice(1)||'mentors',v=h.indexOf('mentee')==0?'mentee':'mentors';
  $('n1').className=v=='mentors'?'on':'';$('n2').className=v=='mentee'?'on':'';
  $('st').textContent=DB?'팀 공용 저장소에 저장돼요':ready?(ADMIN?'수정 내용은 이 브라우저에 저장돼요'+(PW?' · 🔒 접속 비밀번호 사용 중':''):'보기 전용'):'불러오는 중…';
  $('flt').style.display=v=='mentors'?'':'none';
  if(v=='mentors'){
    var cats=['전체'].concat(Array.from(new Set(DATA.map(function(x){return x.cat}).filter(Boolean))));
    if(cats.indexOf(LV.cat)<0)LV.cat='전체';
    var cs=$('cat'),want=cats.join('|');
    if(cs.dataset.k!=want){cs.dataset.k=want;cs.innerHTML=cats.map(function(c){return'<option'+(c==LV.cat?' selected':'')+'>'+esc(c)+'</option>'}).join('')}
    var base=filtered(),n={p:0,m:0};base.forEach(function(x){n[x.k]++});

  $('sk').value=LV.sk;$('sd').textContent=LV.sd=='desc'?'↓ 내림차순':'↑ 오름차순';$('sd').disabled=!LV.sk;
  $('main').innerHTML=v=='mentors'?mentorsView():menteeView(h.slice(7))}
